name: Publish Image

on:
  workflow_call:
    inputs:
      image:
        description: GHCR image name; empty uses ghcr.io/<repository>.
        default: ""
        type: string
      tags:
        description: Raw image tags; empty infers release or stage tags from the event.
        default: ""
        type: string
      delete-tags:
        description: Raw image tags to remove.
        default: ""
        type: string
      prebuild-node:
        description: Prepare a Node 24 application before packaging its runtime image.
        default: false
        type: boolean
    secrets:
      BT_PACKAGE_TOKEN:
        required: false

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('stage-{0}-{1}', github.repository, github.event.pull_request.number) || format('publish-{0}', github.repository) }}
  cancel-in-progress: false
  queue: max

jobs:
  image:
    runs-on: ubuntu-24.04-arm
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Check out publisher automation
        uses: actions/checkout@v4
        with:
          repository: broadsheet-technology/publisher
          ref: v5
          path: .publisher
          persist-credentials: false
      - name: Plan image operation
        id: plan
        env:
          TAGS: ${{ inputs.tags }}
          DELETE_TAGS: ${{ inputs.delete-tags }}
        run: node .publisher/scripts/images.cjs plan
      - name: Check out application
        if: steps.plan.outputs.publish == 'true'
        uses: actions/checkout@v4
        with:
          path: candidate
          persist-credentials: false
      - name: Build Node application
        if: steps.plan.outputs.publish == 'true' && inputs.prebuild-node
        uses: ./.publisher/.github/actions/node-project
        with:
          package-token: ${{ secrets.BT_PACKAGE_TOKEN || github.token }}
      - name: Publish image
        if: steps.plan.outputs.publish == 'true'
        uses: ./.publisher/.github/actions/publish-image
        with:
          image: ${{ inputs.image }}
          tags: ${{ steps.plan.outputs.tags }}
      - name: Delete image tags
        if: steps.plan.outputs.delete-tags != ''
        uses: actions/github-script@v7
        env:
          IMAGE: ${{ inputs.image || format('ghcr.io/{0}', github.repository) }}
          DELETE_TAGS: ${{ steps.plan.outputs.delete-tags }}
        with:
          script: |
            const {deleteImages} = require(`${process.env.GITHUB_WORKSPACE}/.publisher/scripts/images.cjs`);
            await deleteImages({github, core}, process.env.IMAGE, process.env.DELETE_TAGS);
