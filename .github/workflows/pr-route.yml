name: Route Pull Request

on:
  workflow_call:

permissions:
  pull-requests: write
  contents: write

concurrency:
  group: route-${{ github.repository }}-${{ github.event.pull_request.number }}
  cancel-in-progress: false
  queue: max

jobs:
  route:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request_target' &&
      contains(fromJSON('["opened", "reopened", "synchronize", "edited", "labeled", "unlabeled"]'), github.event.action)
    steps:
      - name: Check out publisher automation
        uses: actions/checkout@v4
        with:
          repository: broadsheet-technology/publisher
          ref: v5
          path: .publisher
          persist-credentials: false
      - name: Create integration branch and retarget pull request
        uses: actions/github-script@v7
        with:
          script: |
            const {route} = require(`${process.env.GITHUB_WORKSPACE}/.publisher/scripts/integration-branches.cjs`);
            await route({github, context, core});
