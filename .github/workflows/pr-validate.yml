name: Validate Pull Request Metadata

on:
  workflow_call:

permissions:
  contents: read
  pull-requests: read

jobs:
  metadata:
    runs-on: ubuntu-latest
    steps:
      - name: Check out publisher automation
        uses: actions/checkout@v4
        with:
          repository: broadsheet-technology/publisher
          ref: v5
          path: .publisher
          persist-credentials: false
      - name: Validate current pull request metadata
        uses: actions/github-script@v7
        with:
          script: |
            const {validateMetadata} = require(`${process.env.GITHUB_WORKSPACE}/.publisher/scripts/integration-branches.cjs`);
            const {data: pr} = await github.rest.pulls.get({...context.repo, pull_number: context.payload.pull_request.number});
            validateMetadata(pr);
