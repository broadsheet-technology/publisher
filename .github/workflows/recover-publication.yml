name: Recover Failed Publication

on:
  workflow_call:
    inputs:
      source-pr:
        required: true
        type: string
      merge-sha:
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: publish-${{ github.repository }}
  cancel-in-progress: false
  queue: max

jobs:
  recover:
    runs-on: ubuntu-latest
    env:
      SOURCE_PR: ${{ inputs.source-pr }}
      MERGE_SHA: ${{ inputs.merge-sha }}
    steps:
      - name: Check out publisher automation
        uses: actions/checkout@v4
        with:
          repository: broadsheet-technology/publisher
          ref: v5
          path: .publisher
          persist-credentials: false
      - name: Validate recovery target
        id: target
        uses: actions/github-script@v7
        with:
          script: |
            const {validateRecovery} = require(`${process.env.GITHUB_WORKSPACE}/.publisher/scripts/integration-branches.cjs`);
            await validateRecovery({github, context, core});
      - name: Check out integration branch
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.branch }}
          path: candidate
          fetch-depth: 0
      - name: Revert failed merge
        working-directory: candidate
        env:
          INTEGRATION_BRANCH: ${{ steps.target.outputs.branch }}
        run: bash "$GITHUB_WORKSPACE/.publisher/scripts/revert-integration-merge.sh"
      - name: Reopen and annotate source pull request
        uses: actions/github-script@v7
        env:
          INTEGRATION_BRANCH: ${{ steps.target.outputs.branch }}
        with:
          script: |
            const {annotateRecovery} = require(`${process.env.GITHUB_WORKSPACE}/.publisher/scripts/integration-branches.cjs`);
            await annotateRecovery({github, context, core});
