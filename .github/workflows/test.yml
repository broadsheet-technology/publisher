name: Publisher Tests

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Check shell syntax
        run: |
          for script in scripts/*.sh; do
            bash -n "$script"
          done
      - name: Run tests
        run: node --test tests/*.test.cjs

  release:
    name: Publish v5 tag
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: publisher-v5
      cancel-in-progress: false
    steps:
      - name: Point v5 at tested main
        uses: actions/github-script@v7
        with:
          script: |
            const repo = context.repo;
            const {data: main} = await github.rest.git.getRef({...repo, ref: 'heads/main'});
            if (main.object.sha !== context.sha) {
              core.info('Main advanced; its own test run will publish v5.');
              return;
            }
            const ref = 'tags/v5';
            try {
              await github.rest.git.getRef({...repo, ref});
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.git.createRef({...repo, ref: `refs/${ref}`, sha: context.sha});
              return;
            }
            await github.rest.git.updateRef({...repo, ref, sha: context.sha, force: true});
