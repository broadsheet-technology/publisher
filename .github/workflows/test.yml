name: Publisher Tests

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check workflow metadata
        run: ruby -ryaml -e 'YAML.load_file(".github/workflows/publish.yml")'

      - name: Check embedded tag planner
        run: |
          ruby -ryaml -e '
            workflow = YAML.load_file(".github/workflows/publish.yml")
            planner = workflow.fetch("jobs").fetch("image").fetch("steps").find { |step| step["name"] == "Plan image tags" }
            abort "embedded tag planner differs from scripts/plan-tags.sh" unless planner.fetch("run") == File.read("scripts/plan-tags.sh")
          '

      - name: Check embedded tag deleter
        run: |
          ruby -ryaml -e '
            workflow = YAML.load_file(".github/workflows/publish.yml")
            deleter = workflow.fetch("jobs").fetch("image").fetch("steps").find { |step| step["name"] == "Delete GHCR tags" }
            abort "embedded tag deleter differs from scripts/delete-tags.sh" unless deleter.fetch("run") == File.read("scripts/delete-tags.sh")
          '

      - name: Check shell syntax
        run: bash -n scripts/*.sh tests/*.test.sh tests/fixtures/gh

      - name: Run tests
        run: |
          ./tests/plan-tags.test.sh
          ./tests/delete-tags.test.sh
