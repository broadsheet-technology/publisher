name: Publish prepared image
description: Tag and publish a prepared ARM64 checkout to GHCR.

inputs:
  image:
    description: GHCR image name; empty uses ghcr.io/<repository>.
    default: ""
  tags:
    description: Raw tags; empty uses the checkout SHA, package version, and latest.
    default: ""

runs:
  using: composite
  steps:
    - name: Read image tags
      id: tags
      shell: bash
      working-directory: candidate
      env:
        IMAGE: ${{ inputs.image || format('ghcr.io/{0}', github.repository) }}
        TAGS: ${{ inputs.tags }}
        PUBLISHER_ACTION_PATH: ${{ github.action_path }}
      run: node "$PUBLISHER_ACTION_PATH/../../../scripts/images.cjs" tags
    - uses: docker/setup-buildx-action@v3
    - uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}
    - name: Build and publish image
      uses: docker/build-push-action@v6
      env:
        DOCKER_BUILD_SUMMARY: "false"
        DOCKER_BUILD_RECORD_UPLOAD: "false"
      with:
        context: candidate
        file: candidate/Dockerfile
        push: true
        platforms: linux/arm64
        tags: ${{ steps.tags.outputs.tags }}
        cache-from: type=gha,scope=${{ inputs.image || format('ghcr.io/{0}', github.repository) }}
        cache-to: type=gha,scope=${{ inputs.image || format('ghcr.io/{0}', github.repository) }},mode=max
